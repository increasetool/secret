    <!-- Script de delay -->
    <style>.esconder { display: none }</style>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            /* ALTERE O VALOR 5 PARA OS SEGUNDOS EM QUE AS SEÇÕES VÃO APARECER */
            var SECONDS_TO_DISPLAY = 5;
            var CLASS_TO_DISPLAY = ".esconder";
            /* DAQUI PARA BAIXO NÃO PRECISA ALTERAR */
            var EXPIRATION_DAYS = 14;
            var alreadyDisplayedKey = "alreadyElsDisplayed" + SECONDS_TO_DISPLAY;
            var elsHidden = document.querySelectorAll(CLASS_TO_DISPLAY);
            var elsDisplayed = false;
            var attempts = 0;

            class StorageHandler {
                static expiryTime = EXPIRATION_DAYS * 86400000;

                static set(key, value) {
                    localStorage.setItem(
                        key,
                        JSON.stringify({
                            value: value,
                            expiry: new Date().getTime() + this.expiryTime
                        })
                    );
                }

                static get(key) {
                    const itemStr = localStorage.getItem(key);
                    if (!itemStr) {
                        return null;
                    }
                    const item = JSON.parse(itemStr);
                    if (new Date().getTime() > item.expiry) {
                        localStorage.removeItem(key);
                        return null;
                    }
                    return item.value;
                }
            }

            function displayElements() {
                elsHidden.forEach(function(el) {
                    el.style.display = "";
                });
                elsDisplayed = true;
                StorageHandler.set(alreadyDisplayedKey, true);
            }

            function checkVideoAndDisplay() {
                const player = window.ConverteAi && window.ConverteAi.players && window.ConverteAi.players['67ca1961b0afe3c8ad34b6a7'];
                if (player) {
                    const currentTime = player.currentTime;
                    if (currentTime >= SECONDS_TO_DISPLAY) {
                        displayElements();
                    } else {
                        setTimeout(checkVideoAndDisplay, 1000);
                    }
                } else if (attempts < 10) {
                    attempts++;
                    setTimeout(checkVideoAndDisplay, 1000);
                }
            }

            if (StorageHandler.get(alreadyDisplayedKey)) {
                displayElements();
            } else {
                checkVideoAndDisplay();
            }
        });
    </script>
