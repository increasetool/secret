<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com VTurb Player</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            display: none; /* Inicialmente oculto */
        }
        .checkout-img {
            width: 300px;
            display: block;
            margin: 40px auto;
        }
        .offer-text {
            font-size: 29px;
            font-weight: bold;
            text-align: center;
            margin: 40px 0;
        }
        .offer-text span {
            color: gold;
        }
        @media (max-width: 768px) {
            .offer-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Vídeo VTurb Player -->
    <div class="videobox">
        <iframe id="vturb-player" src="https://player.vturb.com.br/4f9236a9-4e2d-47ab-986a-8e0bf380cebe" frameborder="0" allowfullscreen style="width:100%;height:100%;"></iframe>
    </div>

    <!-- Conteúdo que será exibido após 5 segundos -->
    <div class="container" id="content">
        <p class="offer-text">To get started with <span>AlphaBites</span> today, simply click below and take advantage of this unique special time-limited offer…</p>
        
        <a href="https://buygoods.com/secure/checkout.html?sessid2=sessid20250305172514270&aff_id=85614&account_id=9236&product_codename=alp6DTC&redirect=aHR0cHM6Ly9nZXRhbHBoYWJpdGVzLmNvbS91cHNlbGwtZHRjLw==&vid1=dtcva&vid3=va&fb=1">
            <img src="https://i.postimg.cc/FzBDs29N/Captura-de-Tela-3-1.png" class="checkout-img" alt="Checkout 1">
        </a>
    
        <a href="https://buygoods.com/secure/checkout.html?sessid2=sessid20250305172514270&aff_id=85614&account_id=9236&product_codename=alp3DTC&redirect=aHR0cHM6Ly9nZXRhbHBoYWJpdGVzLmNvbS91cHNlbGwtZHRjLw==&vid1=dtcva&vid3=va&fb=1">
            <img src="https://i.postimg.cc/26fdkhgc/Captura-de-Tela-4-1.png" class="checkout-img" alt="Checkout 2">
        </a>
    
        <a href="https://buygoods.com/secure/checkout.html?sessid2=sessid20250305172514270&aff_id=85614&account_id=9236&product_codename=alp2DTC&redirect=aHR0cHM6Ly9nZXRhbHBoYWJpdGVzLmNvbS91cHNlbGwtZHRj&vid1=dtcva&vid3=va&fb=1">
            <img src="https://i.postimg.cc/KvYP8Zs2/Captura-de-Tela-5-1.png" class="checkout-img" alt="Checkout 3">
        </a>
    </div>

    <script type="text/javascript">
        // Função para monitorar o tempo do vídeo
        function monitorVideoTime() {
            const player = document.getElementById('vturb-player');
            const content = document.getElementById('content');

            // Verifica se o player está carregado
            if (player) {
                // Adiciona um listener para o evento de mensagem (postMessage)
                window.addEventListener('message', function(event) {
                    // Verifica se a mensagem é do VTurb Player
                    if (event.origin === 'https://player.vturb.com.br') {
                        const data = event.data;

                        // Verifica se a mensagem contém o tempo atual do vídeo
                        if (data.currentTime) {
                            console.log("Tempo assistido:", data.currentTime);

                            // Exibe o conteúdo após 5 segundos
                            if (data.currentTime >= 5) {
                                console.log("Tempo atingido! Mostrando conteúdo...");
                                content.style.display = 'block';
                                window.removeEventListener('message', arguments.callee); // Remove o listener
                            }
                        }
                    }
                });
            } else {
                console.error("Player não encontrado!");
            }
        }

        // Inicia o monitoramento após o player carregar
        document.getElementById('vturb-player').onload = function() {
            console.log("Player carregado!");
            monitorVideoTime();
        };
    </script>
</body>
</html>
