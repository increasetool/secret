<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Corrigido</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: black;
            color: white;
            margin: 0;
            padding: 0;
        }
        .esconder {
            display: none;
        }
        .checkout-img {
            width: 300px;
            display: block;
            margin: 40px auto;
        }
        .offer-text {
            font-size: 29px;
            font-weight: bold;
            text-align: center;
            margin: 40px 0;
        }
        .offer-text span {
            color: gold;
        }
        @media (max-width: 768px) {
            .offer-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Vídeo -->
    <div class="videobox">
        <div id="vid_67ca1961b0afe3c8ad34b6a7" style="position:relative;width:100%;padding: 56.25% 0 0;"></div>
    </div>
    
    <script type="text/javascript">
        // Exibir o conteúdo após 5 segundos de visualização da página
        setTimeout(function() {
            document.getElementById('content').style.display = 'block';
        }, 5000); // 5000ms = 5 segundos
    </script>

    <!-- Conteúdo que será exibido após o tempo determinado -->
    <div class="esconder" id="content">
        <p class="offer-text">Para começar com <span>AlphaBites</span> hoje, clique abaixo e aproveite esta oferta especial por tempo limitado…</p>
        
        <a href="#">
            <img src="https://i.postimg.cc/FzBDs29N/Captura-de-Tela-3-1.png" class="checkout-img" alt="Checkout 1">
        </a>
    </div>
</body>
</html>
