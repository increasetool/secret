    <script type="text/javascript">
        // Carrega o script do player
        var s = document.createElement("script");
        s.src = "https://scripts.converteai.net/4f9236a9-4e2d-47ab-986a-8e0bf380cebe/players/67ca1961b0afe3c8ad34b6a7/player.js";
        s.async = true;
        document.head.appendChild(s);

        // Função para monitorar o tempo do vídeo
        s.onload = function() {
            function checkPlayer() {
                var player = window.ConverteAi && window.ConverteAi.players && window.ConverteAi.players['67ca1961b0afe3c8ad34b6a7'];
                if (player) {
                    console.log("Player carregado!");

                    // Monitora o evento de play
                    player.on('play', function() {
                        console.log("Vídeo iniciado...");

                        // Monitora o tempo do vídeo
                        player.on('timeupdate', function(event) {
                            console.log("Tempo assistido:", event.currentTime);

                            // Exibe o conteúdo após 5 segundos de vídeo assistido
                            if (event.currentTime >= 5) {
                                console.log("Tempo atingido! Mostrando conteúdo...");
                                document.getElementById('content').style.display = 'block';
                                player.off('timeupdate'); // Remove o listener para evitar múltiplas execuções
                            }
                        });
                    });
                } else {
                    console.log("Aguardando player...");
                    setTimeout(checkPlayer, 1000); // Tenta novamente após 1 segundo
                }
            }
            checkPlayer();
        };
    </script>
